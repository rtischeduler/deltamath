<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study.com</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #popup-message {
            display: none;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        #popup-message h2 { margin-top: 0; font-size: 24px; }
        #popup-message p { font-size: 16px; color: #cccccc; }
    </style>
</head>
<body>
    <div id="popup-message">
        <h2>Missing Permission</h2>
        <p>Pop-up windows are required for this site. Please allow pop-ups for this site and refresh the page. (Next to bookmark)</p>
    </div>
    <script>
        const HTML = `<!DOCTYPE html> <html> <head> <title>Clever | Portal </title> <style> html, body, div, iframe { margin: 0; padding: 0; height: 100%; border: none; background: #000; } iframe { display: block; width: 100%; height: 100%; border: none; overflow: hidden; } </style> <script>window.addEventListener("beforeunload", function (e) { e.preventDefault(); e.returnValue = ""; return ""; });<\/script> </head> <body> <iframe src="https://cdn.jsdelivr.net/gh/lotsacookie/kstuff/Assets/embed/launch.svg?url=https://cdn.jsdelivr.net/gh/lotsacookie/kstuff/index.html" frameborder="0"></iframe> </body> </html>`;

        function launch() {
            var w;
            try {
                w = window.open('about:blank', '_blank', 'width=1000,height=700');
            } catch (e) {
                w = null;
            }
            if (!w || w.closed || typeof w.closed === 'undefined') {
                document.getElementById('popup-message').style.display = 'block';
                return false;
            }
            w.name = "classroomSession";
            w.document.open();
            w.document.write(HTML);
            w.document.close();
            window.location.replace("https://my.ncedcloud.org");
            return true;
        }

        if (!launch()) {
            // Retry on a click if the instant attempt was blocked.
            document.addEventListener('click', launch);
        }
    </script>
</body>
</html>
